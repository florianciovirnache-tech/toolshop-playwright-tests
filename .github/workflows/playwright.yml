name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NEW 1
      - name: Checkout Toolshop app
        uses: actions/checkout@v4
        with:
          repository: testsmith-io/practice-software-testing
          path: toolshop

      # NEW 2
      - name: Start Toolshop in Docker
        working-directory: toolshop
        run: docker compose -f docker-compose.prod.yml up -d

      # NEW 3
      - name: Seed database
        working-directory: toolshop
        run: |
          for i in $(seq 1 30); do
            docker compose -f docker-compose.prod.yml exec -T laravel-api php artisan migrate:fresh --seed --force && break
            echo "Database not ready yet, retrying in 5s..."
            sleep 5
          done
          docker compose -f docker-compose.prod.yml exec -T -u root laravel-api chown -R www-data:www-data
