name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -f docker-compose.prod.yml
    steps:
      - uses: actions/checkout@v4

      # NEW 1
      - name: Checkout Toolshop app
        uses: actions/checkout@v4
        with:
          repository: testsmith-io/practice-software-testing
          path: toolshop

      # NEW 2
      - name: Start Toolshop in Docker
        working-directory: toolshop
        run: $COMPOSE up -d

      # NEW 3
      - name: Seed database
        working-directory: toolshop
        run: |
          for i in $(seq 1 30); do
            $COMPOSE exec -T laravel-api php artisan migrate:fresh --seed --force && break
            echo "Database not ready yet, retrying in 5s..."
            sleep 5
          done
          $COMPOSE exec -T --user root laravel-api chown -R www-data:www-data storage bootstrap/cache

      # NEW 4
      - name: Wait for Toolshop to be ready
        run: |
          timeout 300 bash -c 'until curl -sf http://localhost:8091/brands > /dev/null; do sleep 5; done'
          timeout 300 bash -c 'until curl -sf http://localhost:4200 > /dev/null; do sleep 5; done'

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # NEW 5
      - name: Dump Toolshop diagnostics on failure
        if: failure()
        working-directory: toolshop
        run: |
          $COMPOSE ps
          curl -s -i http://localhost:8091/brands | head -n 30
          $COMPOSE exec -T laravel-api sh -c "ls -l storage/logs; tail -n 30 storage/logs/laravel.log" || true
          $COMPOSE logs --tail 30 web laravel-api
